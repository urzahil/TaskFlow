name: CI

# Runs the unit tests, lint and screenshot verification on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Maven Central rate-limits the shared runners (HTTP 429); resolve through Google's mirror
      # first (see settings.gradle.kts). Gradle falls back to Maven Central when it lacks an artifact.
      MAVEN_CENTRAL_MIRROR: https://maven-central.storage-download.googleapis.com/maven2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # A failed build only touches part of the dependencies; do not purge the rest from the cache.
          cache-cleanup: on-success

      # Robolectric downloads android-all jars into ~/.m2 at test time; keep them between runs
      # so a throttled Maven Central does not fail every test class.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests, lint and screenshot verification
        run: |
          # Maven Central rate-limits shared CI runners (HTTP 429), both for Gradle dependencies
          # and for the Robolectric android-all jars downloaded at test time. Retry only when the
          # output shows such a download problem; any other failure fails immediately.
          log="$RUNNER_TEMP/gradle-attempt.log"
          for attempt in 1 2 3; do
            set +e
            ./gradlew testDebugUnitTest lintDebug verifyRoborazziDebug --stacktrace 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && grep -qE 'Too Many Requests|status code 429|MavenArtifactFetcher|Could not (GET|HEAD|resolve)' "$log"; then
              echo "::warning::Gradle attempt $attempt failed on a download error; retrying in $((attempt * 45))s."
              sleep $((attempt * 45))
            else
              exit "$status"
            fi
          done

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

name: CI

# Runs the unit tests, lint and screenshot verification on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Robolectric downloads android-all jars into ~/.m2 at test time; keep them between runs
      # so a throttled Maven Central does not fail every test class.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests, lint and screenshot verification
        run: |
          # Maven Central rate-limits shared CI runners (HTTP 429), both for Gradle dependencies
          # and for the Robolectric android-all jars downloaded at test time. Retry with a pause.
          for attempt in 1 2 3; do
            if ./gradlew testDebugUnitTest lintDebug verifyRoborazziDebug --stacktrace; then
              exit 0
            fi
            echo "::warning::Gradle attempt $attempt failed; retrying in $((attempt * 45))s (Maven Central may be rate limiting)."
            sleep $((attempt * 45))
          done
          exit 1

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

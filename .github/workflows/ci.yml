name: CI

# Runs the unit tests, lint and screenshot verification on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and screenshot verification
        run: ./gradlew testDebugUnitTest lintDebug verifyRoborazziDebug --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

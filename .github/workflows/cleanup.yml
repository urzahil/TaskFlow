name: Delete old workflow runs
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs older than 3 days (keep the 3 newest)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          cutoff="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq ".workflow_runs | sort_by(.created_at) | reverse | .[3:] | .[] | select(.created_at < \"$cutoff\") | .id" \
            | while read -r id; do
                gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
              done

name: Delete old workflow runs
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # Uses the preinstalled GitHub CLI instead of a third-party action.
      - name: Delete workflow runs older than 3 days (keeping the 3 newest)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          cutoff="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.status == \"completed\") | [.created_at, .id] | @tsv" \
            | sort -r | tail -n +4 \
            | while IFS="$(printf '\t')" read -r created id; do
                if [ "$created" \< "$cutoff" ]; then
                  gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
                fi
              done
